<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduTutor - Solicitudes recibidas</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="icon" href="/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0B3D91">
</head>
<body>
  <header class="topbar">
    <a class="marca" href="/"><img class="marca-logo" src="/img/icono-192.png" alt="" width="36" height="36">EduTutor</a>
    <button id="menuBtn" class="menu-btn" aria-label="Menú">☰</button>
    <nav id="nav" class="nav"></nav>
  </header>

  <main class="contenedor">
    <div class="fila-titulo">
      <div>
        <h1>Solicitudes recibidas</h1>
        <p class="subtitulo" style="margin:0">Acepta o rechaza las solicitudes de los estudiantes.</p>
      </div>
      <div style="min-width:200px">
        <label for="filtroEstado">Estado</label>
        <select id="filtroEstado">
          <option value="">Todas</option>
          <option selected>Pendiente</option><option>Aceptada</option><option>Rechazada</option><option>Cancelada</option>
        </select>
      </div>
    </div>

    <div class="tarjeta tabla-wrap" style="padding:0">
      <table>
        <thead><tr><th>Estudiante</th><th>Tutoría</th><th>Fecha y hora</th><th>Comentario</th><th>Estado</th><th></th></tr></thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let datos = [];

    function pintar() {
      const f = $('filtroEstado').value;
      const lista = datos.filter((s) => !f || s.estado === f);
      $('cuerpo').innerHTML = lista.length ? lista.map((s) => `
        <tr>
          <td>${esc(s.estudiante)}<br><span class="ayuda">${esc([s.grado, s.seccion].filter(Boolean).join(' ') || s.correo_estudiante)}</span></td>
          <td>${esc(s.titulo)}<br><span class="ayuda">${esc(s.materia)}</span></td>
          <td>${fmtFecha(s.fecha)}<br>${fmtHora(s.hora_inicio)} - ${fmtHora(s.hora_fin)}</td>
          <td>${esc(s.comentario || '—')}</td>
          <td>${badge(s.estado)}</td>
          <td>${s.estado === 'Pendiente' ? `<div class="acciones">
            <button class="btn btn-ok btn-chico" data-resp="Aceptada" data-id="${s.id_solicitud}">Aceptar</button>
            <button class="btn btn-peligro btn-chico" data-resp="Rechazada" data-id="${s.id_solicitud}">Rechazar</button>
          </div>` : ''}</td>
        </tr>`).join('')
        : '<tr><td colspan="6" class="vacio">No hay solicitudes con ese estado.</td></tr>';
    }

    async function cargar() {
      try { datos = (await api('/api/solicitudes/recibidas')).solicitudes; pintar(); } catch (e) { mostrarError(e); }
    }

    $('filtroEstado').addEventListener('change', pintar);
    $('cuerpo').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-resp]');
      if (!b) return;
      try {
        const d = await api(`/api/solicitudes/${b.dataset.id}/responder`, { method: 'PUT', body: { estado: b.dataset.resp } });
        mensaje(d.mensaje);
        cargar();
      } catch (err) { mostrarError(err); }
    });

    (async () => { if (await iniciarPagina(['Tutor'])) cargar(); })();
  </script>
</body>
</html>
